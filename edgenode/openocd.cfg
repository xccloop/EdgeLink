# GD32F103RCT6 connected by an ST-Link through SWD.
source [find interface/stlink.cfg]
transport select hla_swd
adapter speed 1000

# GD32F103 is a Cortex-M3 device; OpenOCD's stm32f1x target provides SWD
# attach/reset/flash operations for this compatible target family.
source [find target/stm32f1x.cfg]

# SWDIO, SWCLK, GND and 3V3 are sufficient for this default configuration.
# If the ST-Link NRST pin is wired to MCU NRST, you may instead enable:
# reset_config srst_only srst_nogate
reset_config none
